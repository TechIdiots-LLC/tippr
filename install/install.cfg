###############################################################################
set -e -x

###############################################################################
# Configuration
###############################################################################
# which user to install the code for; defaults to the user invoking this script
TIPPR_USER=${TIPPR_USER:-$SUDO_USER}

# the group to run tippr code as; must exist already
TIPPR_GROUP=${TIPPR_GROUP:-nogroup}

# the root directory to base the install in. must exist already
TIPPR_HOME=${TIPPR_HOME:-/home/$TIPPR_USER}
TIPPR_SRC=${TIPPR_SRC:-$TIPPR_HOME/src}

# Python virtual environment location
TIPPR_VENV=${TIPPR_VENV:-$TIPPR_HOME/venv}

# the domain that you will connect to your tippr install with.
# MUST contain a . in it somewhere as browsers won't do cookies for dotless
# domains. an IP address will suffice if nothing else is available.
TIPPR_DOMAIN=${TIPPR_DOMAIN:-tippr.local}

# the plugins to install if they adhere to plugin naming and location
# conventions on the host
TIPPR_PLUGINS=${TIPPR_PLUGINS:-about gold}

# aptitude configuration
APTITUDE_OPTIONS=${APTITUDE_OPTIONS:-"-y"}

# Python version
PYTHON_VERSION=${PYTHON_VERSION:-"3.12"}

# Build mcrouter from source. It takes 20+ minutes and the default config
# talks to memcached directly (mcrouter_addr = 127.0.0.1:11211), so it is off
# unless you point mcrouter_addr at mcrouter.
TIPPR_BUILD_MCROUTER=${TIPPR_BUILD_MCROUTER:-0}

# Search backend: "opensearch" installs OpenSearch on this machine (localhost
# only) and keeps its index up to date; "none" skips it, and search pages show
# an error. TIPPR_OPENSEARCH_HEAP is OpenSearch's Java heap (it needs about
# that much memory again for the file cache).
TIPPR_SEARCH=${TIPPR_SEARCH:-opensearch}
TIPPR_OPENSEARCH_HEAP=${TIPPR_OPENSEARCH_HEAP:-1g}

# Site branding and contact details. Left empty, the values in example.ini /
# development.update are used.
TIPPR_SITE_NAME=${TIPPR_SITE_NAME:-}
TIPPR_SITE_DESCRIPTION=${TIPPR_SITE_DESCRIPTION:-}
TIPPR_CONTACT_EMAIL=${TIPPR_CONTACT_EMAIL:-}

# "production" or "development". "auto" picks development for *.local,
# *.localhost and *.test domains and production otherwise. Production turns
# off debug pages, enables captcha, rate limits and required admin TOTP, and
# serves pre-built (minified) CSS and JS.
TIPPR_ENVIRONMENT=${TIPPR_ENVIRONMENT:-auto}

# Number of gunicorn web workers (default: CPU count, at most 8)
TIPPR_WEB_WORKERS=${TIPPR_WEB_WORKERS:-}

# TLS certificate. Give TIPPR_TLS_CERT and TIPPR_TLS_KEY (paths) to use your
# own, e.g. a Cloudflare Origin Certificate; or TIPPR_LETSENCRYPT_EMAIL to get
# one from Let's Encrypt (the domain must point at this server). Otherwise a
# self-signed certificate for TIPPR_DOMAIN is used.
TIPPR_TLS_CERT=${TIPPR_TLS_CERT:-}
TIPPR_TLS_KEY=${TIPPR_TLS_KEY:-}
TIPPR_LETSENCRYPT_EMAIL=${TIPPR_LETSENCRYPT_EMAIL:-}

# Set to 1 when the site is behind Cloudflare's proxy, so client IPs come
# from CF-Connecting-IP (accepted only from Cloudflare's address ranges).
TIPPR_BEHIND_CLOUDFLARE=${TIPPR_BEHIND_CLOUDFLARE:-0}

# Where uploaded media (thumbnails, vault images and stylesheets, logos, ad
# images) is kept; see docs/STORAGE.md.
#   filesystem (the default): /srv/www/media on this server
#   s3: an S3-compatible service (Garage, SeaweedFS, MinIO, Amazon S3,
#       Backblaze B2 …) shared by every frontend server
# With s3, give the service's address and key, and the bucket. Media is still
# served from https://TIPPR_DOMAIN/media/ (nginx fetches it from
# TIPPR_MEDIA_ORIGIN: the bucket's public address, e.g. Garage's website
# endpoint), and browsers upload ad images through https://TIPPR_DOMAIN/s3/.
# These are remembered (in TIPPR_SECRETS_FILE) for later runs.
TIPPR_MEDIA_STORAGE=${TIPPR_MEDIA_STORAGE:-}
TIPPR_S3_ENDPOINT=${TIPPR_S3_ENDPOINT:-}            # e.g. http://172.16.1.60:3900
TIPPR_S3_REGION=${TIPPR_S3_REGION:-}                # e.g. garage (default us-east-1)
TIPPR_S3_KEY_ID=${TIPPR_S3_KEY_ID:-}
TIPPR_S3_SECRET=${TIPPR_S3_SECRET:-}
TIPPR_S3_MEDIA_BUCKET=${TIPPR_S3_MEDIA_BUCKET:-}    # e.g. tippr-media
TIPPR_S3_UPLOADS_BUCKET=${TIPPR_S3_UPLOADS_BUCKET:-}  # default: the media bucket
TIPPR_S3_USE_ACLS=${TIPPR_S3_USE_ACLS:-}            # true for Amazon S3 (the default without an endpoint)
TIPPR_MEDIA_ORIGIN=${TIPPR_MEDIA_ORIGIN:-}          # e.g. http://172.16.1.60:3902/ (default: endpoint/bucket/)
TIPPR_MEDIA_ORIGIN_HOST=${TIPPR_MEDIA_ORIGIN_HOST:-}  # Host header for it, e.g. tippr-media (Garage websites)

# Set to 1 to enable a ufw firewall that only allows SSH (TIPPR_SSH_PORT),
# HTTP and HTTPS. Internal services already listen on localhost; this also
# covers the few that cannot (epmd, Erlang distribution, ZooKeeper JMX).
TIPPR_FIREWALL=${TIPPR_FIREWALL:-0}
TIPPR_SSH_PORT=${TIPPR_SSH_PORT:-22}

# pip URL or requirement spec used to install baseplate. Can be a git+ URL
# (e.g. git+https://github.com/TechIdiots-LLC/baseplate.py.git@develop#egg=baseplate)
# or a file URL or local path for editable installs. If unset, the installer
# will fall back to installing from PyPI or the legacy REEDIT_BASEPLATE_REPO.
TIPPR_BASEPLATE_PIP_URL=${TIPPR_BASEPLATE_PIP_URL:-"git+https://github.com/TechIdiots-LLC/tippr-baseplate.py.git@develop#egg=baseplate"}

# Use a fork of formenergy-observability that relaxes packaging constraints
# so installer can use modern `packaging` during builds. This should point
# to a pip-style URL (git+https or file://). If unset, the installer will
# install the package from PyPI as part of the runtime deps.
TIPPR_FORMENERGY_OBSERVABILITY_PIP_URL=${TIPPR_FORMENERGY_OBSERVABILITY_PIP_URL:-"git+https://github.com/TechIdiots-LLC/tippr-formenergy-observability.git@main#egg=formenergy-observability"}

# Service repos (format: owner/repo) - override to use your own forks
TIPPR_WEBSOCKETS_REPO=${TIPPR_WEBSOCKETS_REPO:-"TechIdiots-LLC/tippr-service-websockets"}
TIPPR_ACTIVITY_REPO=${TIPPR_ACTIVITY_REPO:-"TechIdiots-LLC/tippr-service-activity"}

# Custom datastax repo (legacy - now using Docker for Cassandra)
CASSANDRA_SOURCES_LIST=/etc/apt/sources.list.d/cassandra.sources.list

export DEBIAN_FRONTEND=noninteractive

# Service passwords. install/tippr.sh generates these into
# /etc/tippr/secrets.env and exports them before running the setup scripts.
# When a setup script is run on its own (e.g. in CI), reuse the saved value,
# or fall back to the old development default. Not during a full install
# (TIPPR_INSTALLER is set), where tippr.sh generates the values itself.
for _var in TIPPR_DB_PASSWORD TIPPR_AMQP_PASSWORD; do
    if [ -z "$TIPPR_INSTALLER" ] && [ -z "${!_var}" ]; then
        _saved=$(sed -n "s/^${_var}=//p" /etc/tippr/secrets.env 2>/dev/null | tail -n 1)
        case $_var in
            TIPPR_DB_PASSWORD) export TIPPR_DB_PASSWORD=${_saved:-password} ;;
            TIPPR_AMQP_PASSWORD) export TIPPR_AMQP_PASSWORD=${_saved:-tippr} ;;
        esac
    fi
done
unset _var _saved
