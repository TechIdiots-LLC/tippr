[egg_info]
tag_build = dev

[nosetests]
where = r2/tests/

[extract_messages]
add_comments = TRANSLATORS:
keywords =  P_:1,2 NP_:1,2 _md _mdf _ws _wsf:1
mapping_file = babel.cfg
width = 80

[tool:pytest]
# the tests are named both ways (reddit's nose found *_tests.py too)
python_files = test_*.py *_test.py *_tests.py
