name: CI (Ubuntu 24.04)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system packages (using install scripts)
        run: |
          # Make install scripts executable
          chmod +x install/*.sh

          # Run the apt install script
          sudo install/install_apt.sh

      - name: Install and configure services
        run: |
          # Install services (postgres, memcached, rabbitmq, etc.)
          sudo install/install_services.sh

          # Configure PostgreSQL
          sudo install/setup_postgres.sh

      - name: Install Cassandra
        run: |
          # Install Cassandra using install script
          sudo install/install_cassandra.sh

          # Configure Cassandra (create keyspace and tables)
          sudo install/setup_cassandra.sh

      # exactly install/requirements.txt, as the installer and the Docker
      # image install it (--no-deps), so a change to a pin (a Dependabot
      # update, say) is what these tests run against
      - name: Install the pinned Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r install/requirements.txt
          # the ones pinned to a URL, whatever was there (as tippr.sh does)
          grep -E '^[A-Za-z0-9_.-]+ @ ' install/requirements.txt > url-pinned.txt
          pip install --no-deps --force-reinstall -r url-pinned.txt

      - name: Build and install r2 (with the compiled Cython modules)
        run: |
          cd r2
          python setup.py build
          pip install --no-build-isolation --no-deps -e .

      - name: Check the packages fit together
        run: |
          pip check
          python scripts/check_requirements.py r2

      - name: Verify r2 package installation
        run: |
          python -c "import r2; print('r2 loaded from:', r2.__file__)"
          python -c "import r2.lib.db.sorts as s; print('epoch_seconds present:', hasattr(s,'epoch_seconds'))"

      - name: Run the tests (r2, unit and functional)
        env:
          DATABASE_URL: "postgresql://tippr:password@127.0.0.1/tippr"
        run: |
          # the functional ones run requests through the whole app (WebTest),
          # with the stores mocked; r2/setup.cfg collects *_tests.py too
          python -m pytest r2/r2/tests -v --tb=short

      - name: Archive test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            cassandra.out
            r2/r2/tests/**/test*.log
