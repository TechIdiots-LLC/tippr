# Builds a tippr release: the Docker image (pushed to Docker Hub), a Docker
# Compose bundle and an installer tarball (attached to a GitHub release).
#
# Run it by pushing a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# or from the Actions tab ("Run workflow"), which builds and tests without
# publishing unless "publish" is ticked.
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token with write access), and optionally the repository
# variable DOCKERHUB_IMAGE (default: <DOCKERHUB_USERNAME>/tippr).

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0); blank: a test build named after the commit"
        required: false
      publish:
        description: "Push the image and create a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # companion repositories built into the image (branch or tag)
  I18N_REF: master
  WEBSOCKETS_REF: master
  ACTIVITY_REF: master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            publish="${{ inputs.publish }}"
          else
            version="0.0.0-dev.$(git rev-parse --short HEAD)"
            publish="${{ inputs.publish }}"
          fi
          image="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$image" ]; then
            image="${{ secrets.DOCKERHUB_USERNAME }}/tippr"
          fi
          if [ "$publish" = "true" ] && [ "$image" = "/tippr" ]; then
            echo "::error::set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to publish"
            exit 1
          fi
          [ "$image" = "/tippr" ] && image=tippr
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Building tippr $version ($image), publish: $publish"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tippr:release
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            I18N_REF=${{ env.I18N_REF }}
            WEBSOCKETS_REF=${{ env.WEBSOCKETS_REF }}
            ACTIVITY_REF=${{ env.ACTIVITY_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the compose stack
        working-directory: docker
        run: |
          cat > .env <<ENV
          TIPPR_DOMAIN=tippr.test
          TIPPR_DB_PASSWORD=$(openssl rand -hex 16)
          TIPPR_AMQP_PASSWORD=$(openssl rand -hex 16)
          TIPPR_TLS=internal
          TIPPR_IMAGE=tippr
          TIPPR_VERSION=release
          TIPPR_ENVIRONMENT=production
          TIPPR_CASSANDRA_HEAP=1G
          TIPPR_OPENSEARCH_HEAP=512m
          ENV
          bash smoke-test.sh

      - name: Show logs after a failure
        if: failure()
        working-directory: docker
        run: docker compose logs --no-color --tail 200

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        if: steps.version.outputs.publish == 'true'
        run: |
          image="${{ steps.version.outputs.image }}"
          version="${{ steps.version.outputs.version }}"
          tags="$version"
          # 1.2.3 also as 1.2 and latest; pre-releases (1.2.3-rc1) only as is
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags="$tags ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} latest"
          fi
          for tag in $tags; do
            docker tag tippr:release "$image:$tag"
            docker push "$image:$tag"
          done

      - name: Make the release bundles
        run: |
          bash docker/make-bundles.sh "${{ steps.version.outputs.version }}" \
              "${{ steps.version.outputs.image }}" tippr:release dist

      - uses: actions/upload-artifact@v4
        with:
          name: tippr-${{ steps.version.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tippr-${{ needs.build.outputs.version }}
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: tippr ${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: dist/*
          body: |
            ## Docker

            ```bash
            docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}
            ```

            Download `tippr-${{ needs.build.outputs.version }}-compose.tar.gz`,
            unpack it, copy `.env.example` to `.env`, fill it in and run
            `docker compose up -d`. See its README.

            ## Installer (Ubuntu 24.04, no Docker)

            `tippr-${{ needs.build.outputs.version }}-installer.tar.gz` holds
            tippr and the repositories the installer would clone, at this
            release's versions:

            ```bash
            sudo mkdir -p /home/tippr/src
            sudo tar -xzf tippr-${{ needs.build.outputs.version }}-installer.tar.gz -C /home/tippr/src
            cd /home/tippr/src/tippr
            sudo TIPPR_USER=tippr TIPPR_DOMAIN=example.com ./install-tippr.sh
            ```

            `SHA256SUMS` lists the files' checksums.
