# Releases VERSION, if there's no GitHub release for it yet: on every push
# to master (so merging a "Create bump version PR" pull request releases),
# or from Actions > Release > Run workflow.
#
# It builds the Docker image and smoke-tests the compose stack with it,
# pushes the image to Docker Hub, builds and boot-tests the Proxmox
# template, and publishes a GitHub release with the compose bundle,
# installer tarball and template, with CHANGELOG.md's section for the
# version as the notes. A manual run with "dry run" ticked builds and tests
# without publishing.
#
# Needs, in the "release" environment (Settings > Environments), the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub personal access token
# with read and write access). The repository variable DOCKERHUB_IMAGE
# overrides the image name (default: techidiotsllc/tippr).

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and test only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # companion repositories built into the image (branch or tag)
  I18N_REF: master
  WEBSOCKETS_REF: master
  ACTIVITY_REF: master

jobs:
  release-check:
    name: Check if VERSION is already released
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${version}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            version="${version}-dev.$(git rev-parse --short HEAD)"
            build=true publish=false
          elif [ "$status" = "200" ]; then
            build=false publish=false
          else
            build=true publish=true
          fi
          image="${{ vars.DOCKERHUB_IMAGE }}"
          [ -n "$image" ] || image=techidiotsllc/tippr
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$version" | grep -q -- '-' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Version $version (release lookup: $status); build: $build, publish: $publish"

  build:
    needs: release-check
    if: needs.release-check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Docker Hub credentials (only used when publishing)
    environment: release
    steps:
      - uses: actions/checkout@v7

      # the image, the smoke test and the browser test (shared with
      # ci-docker.yml)
      - name: Build and test the compose stack
        uses: ./.github/actions/stack-test
        with:
          version: ${{ needs.release-check.outputs.version }}
          i18n-ref: ${{ env.I18N_REF }}
          websockets-ref: ${{ env.WEBSOCKETS_REF }}
          activity-ref: ${{ env.ACTIVITY_REF }}

      # every page the browser test saw, at desktop and phone width, light
      # and night (report.json lists what failed, and faint text as warnings)
      - name: Upload the browser test's screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ needs.release-check.outputs.version }}
          path: docker/visual-results
          if-no-files-found: ignore

      - name: Check the Docker Hub secrets
        if: needs.release-check.outputs.publish == 'true'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to the release environment's secrets"
            exit 1
          fi

      - name: Log in to Docker Hub
        if: needs.release-check.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        if: needs.release-check.outputs.publish == 'true'
        run: |
          image="${{ needs.release-check.outputs.image }}"
          version="${{ needs.release-check.outputs.version }}"
          tags="$version"
          # 1.2.3 also as 1.2 and latest; pre-releases (1.2.3-rc1) only as is
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags="$tags ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} latest"
          fi
          for tag in $tags; do
            docker tag tippr:release "$image:$tag"
            docker push "$image:$tag"
          done

      - name: Make the release bundles
        run: |
          bash docker/make-bundles.sh "${{ needs.release-check.outputs.version }}" \
              "${{ needs.release-check.outputs.image }}" tippr:release dist

      - uses: actions/upload-artifact@v7
        with:
          name: tippr-${{ needs.release-check.outputs.version }}
          path: dist/*

  proxmox:
    needs: [release-check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Make room (the template build needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - uses: actions/download-artifact@v8
        with:
          name: tippr-${{ needs.release-check.outputs.version }}
          path: dist

      - name: Build the Proxmox template
        run: |
          sudo apt-get install -y -q zstd
          version="${{ needs.release-check.outputs.version }}"
          sudo bash proxmox/build-template.sh "dist/tippr-$version-installer.tar.gz" \
              "$PWD/proxmox-dist/tippr-$version-proxmox-amd64.tar.zst"

      - name: Show the installer log after a failure
        if: failure()
        run: sudo tail -200 proxmox-dist/*.install.log || true

      - name: Test the template's first boot
        run: |
          sudo bash proxmox/test-template.sh \
              "proxmox-dist/tippr-${{ needs.release-check.outputs.version }}-proxmox-amd64.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: tippr-${{ needs.release-check.outputs.version }}-proxmox
          path: proxmox-dist/*.tar.zst
          compression-level: 0

  release:
    needs: [release-check, build, proxmox]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tippr-${{ needs.release-check.outputs.version }}*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && rm -f SHA256SUMS && sha256sum tippr-* > SHA256SUMS && cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
          IMAGE: ${{ needs.release-check.outputs.image }}
        run: |
          awk -v ver="## $VERSION" \
            'BEGIN{p=0} $0==ver{p=1; next} /^## / && p==1{exit} p==1{print}' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Downloads

          - **Docker:** \`docker pull $IMAGE:$VERSION\`, or unpack \`tippr-$VERSION-compose.tar.gz\`, copy
            \`.env.example\` to \`.env\`, fill it in and run \`docker compose up -d\` (docker/README.md).
          - **Proxmox:** \`tippr-$VERSION-proxmox-amd64.tar.zst\` is an LXC template with the whole site installed;
            create a container with the site's domain as its hostname and start it (docs/PROXMOX.md).
          - **Installer (Ubuntu 24.04):** unpack \`tippr-$VERSION-installer.tar.gz\` into \`/home/tippr/src\` and
            run \`sudo TIPPR_USER=tippr TIPPR_DOMAIN=example.com ./install-tippr.sh\` in \`tippr/\`; it doesn't need
            to clone anything (docs/INSTALL_tippr.md).

          \`SHA256SUMS\` lists the files' checksums.
          NOTES
          cat notes.md

      - uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.release-check.outputs.version }}
          commit: ${{ github.sha }}
          name: tippr v${{ needs.release-check.outputs.version }}
          bodyFile: notes.md
          artifacts: dist/*
          prerelease: ${{ needs.release-check.outputs.prerelease }}
          allowUpdates: true
