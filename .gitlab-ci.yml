# tippr CI on gitlab.techidiots.net. GitLab ignores the GitHub workflows in .github/, which keep running on the GitHub
# mirror. The light jobs run on the Windows shell runners (tag "windows"); the ones that need Docker or a whole Ubuntu
# machine run on the Linux Docker runner (tags "linux", "docker"), which must be registered with --privileged
# (gitlab-runner-install: install-linux-runner.sh --privileged) for Docker-in-Docker and systemd containers.
#
#   unit-tests        Merge requests and pushes to master: the r2 unit tests, in an Ubuntu 24.04 container with systemd
#                     and the services from the install scripts (.github/workflows/ci-ubuntu-24.yml)
#   installer-smoke   The same: install-tippr.sh in such a container, then check the site answers
#                     (.github/workflows/ci-install-tippr.yml)
#   release-*         Push to master: if there's no GitLab release for VERSION, build and smoke-test the Docker image,
#                     make the compose bundle and installer tarball, build and boot-test the Proxmox template, and
#                     create the release with CHANGELOG.md's section as the notes (.github/workflows/release.yml).
#                     Build > Pipelines > New pipeline with RELEASE_DRY_RUN "true" builds and tests without publishing.
#   bump-version      Build > Pipelines > New pipeline with BUMP_VERSION set: bump VERSION, roll CHANGELOG.md's
#                     "## master" section into it, push release-v<version> and open a merge request. Merging it
#                     makes the release.
#
# Release files go to the generic package registry (Admin > Settings > CI/CD: the package file size limit must allow
# the Proxmox template, ~2 GB) and the image to this project's container registry, when it has one.
#
# CI/CD variables (Settings > CI/CD > Variables), Protected + Masked, environment scope "release/master":
#   CI_PUSH_TOKEN                        Project access token, role Maintainer, scopes api + write_repository
#                                        (bump-version only)
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  Optional: also push the image to Docker Hub. Leave them unset while the
#                                        GitHub mirror's release workflow still pushes it, or both will.
#   DOCKERHUB_IMAGE                      Optional, not secret: the Docker Hub name (default techidiotsllc/tippr), also
#                                        used by the compose bundle and the release notes
#
# The jobs take longer than GitLab's default hour; each sets its own timeout, which the runner's maximum must allow.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid a duplicate branch pipeline while a merge request is open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  BUMP_VERSION:
    value: "none"
    options: ["none", "patch", "minor", "major", "prepatch", "preminor", "premajor", "prerelease"]
    description: "Version bump type. Leave as 'none' to just build and release the current version."
  BUMP_PREID:
    value: "rc"
    description: "Prerelease identifier for the pre* bump types (e.g. alpha, beta, rc)."
  RELEASE_DRY_RUN:
    value: "false"
    options: ["false", "true"]
    description: "'true': build and test the release files without publishing anything."
  # companion repositories built into the image (branch or tag)
  I18N_REF: master
  WEBSOCKETS_REF: master
  ACTIVITY_REF: master

default:
  tags: [windows]

stages:
  - check
  - build
  - release

# Jobs that push or publish run in this environment; scope the protected variables to it.
.release-environment: &release-environment
  name: release/$CI_COMMIT_BRANCH
  action: prepare

.ci-rules: &ci-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $RELEASE_DRY_RUN == "true"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.release-rules: &release-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Docker-in-Docker on the Linux runner
.docker-job:
  tags: [linux, docker]
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: /certs
    GIT_DEPTH: 20
  before_script:
    - apk add --no-cache bash coreutils curl openssl tar zstd musl-utils
    - for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - docker info --format 'Docker {{.ServerVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'

# ── CI ──────────────────────────────────────────────────────────────────────────────────────────────

unit-tests:
  extends: .docker-job
  stage: check
  rules: *ci-rules
  timeout: 2h
  script:
    - bash .gitlab/scripts/systemd-box.sh start tippr-ci
    - bash .gitlab/scripts/systemd-box.sh run tippr-ci .gitlab/scripts/box-unit-tests.sh
  after_script:
    - docker cp tippr-ci:/tmp/unit-tests.xml unit-tests.xml || true
    - bash .gitlab/scripts/systemd-box.sh logs tippr-ci logs || true
    - bash .gitlab/scripts/systemd-box.sh stop tippr-ci
  artifacts:
    when: always
    reports:
      junit: unit-tests.xml
    paths:
      - unit-tests.xml
      - logs/
    expire_in: 7 days

installer-smoke:
  extends: .docker-job
  stage: check
  rules: *ci-rules
  timeout: 2h
  script:
    - bash .gitlab/scripts/systemd-box.sh start tippr-install
    - bash .gitlab/scripts/systemd-box.sh run tippr-install .gitlab/scripts/box-install.sh
  after_script:
    - bash .gitlab/scripts/systemd-box.sh logs tippr-install logs || true
    - bash .gitlab/scripts/systemd-box.sh stop tippr-install
  artifacts:
    when: on_failure
    paths:
      - logs/
    expire_in: 7 days

# ── Release ─────────────────────────────────────────────────────────────────────────────────────────

release-check:
  stage: check
  rules: *release-rules
  script:
    - ./.gitlab/scripts/release-check.ps1
  artifacts:
    reports:
      dotenv: release.env

release-build:
  extends: .docker-job
  stage: build
  rules: *release-rules
  needs: [release-check]
  environment: *release-environment
  resource_group: release
  timeout: 5h
  script:
    - if [ "$RELEASE_BUILD" != "true" ]; then echo "Release $RELEASE_TAG already exists; skipping."; exit 0; fi
    - bash .gitlab/scripts/release-build.sh
  artifacts:
    when: always
    paths:
      - release-files.txt
      - template-install.log
    expire_in: 7 days

release-publish:
  stage: release
  rules: *release-rules
  needs: [release-check, release-build]
  resource_group: release
  script:
    - ./.gitlab/scripts/publish-release.ps1

# ── Version bump ────────────────────────────────────────────────────────────────────────────────────

bump-version:
  stage: build
  resource_group: bump-version
  environment: *release-environment
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $BUMP_VERSION != "none"
  variables:
    GIT_DEPTH: 0
  script:
    - ./.gitlab/scripts/bump.ps1 -BumpType $env:BUMP_VERSION -PreId $env:BUMP_PREID
